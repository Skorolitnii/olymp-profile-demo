<!doctype html>
<html lang="ru" data-theme="blue">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#030534">
    <title>Редизайн ПЛ в Профиле</title>
    <link rel="stylesheet" href="./profile/rt/fonts.css">
    <link rel="stylesheet" href="./profile/rt/base.css">
    <link rel="stylesheet" href="./showcase.css?rev=games-levels">
    <script src="./showcase.js?rev=games-levels" defer></script>
  </head>
  <body>
    <main class="showcase">
      <header class="showcase__header">
        <img class="showcase__logo" src="./assets/olymp.svg" alt="Olymp" width="131" height="25">
        <h1>Редизайн ПЛ в Профиле</h1>
      </header>
      <div class="versions" role="tablist" aria-label="Версии шапки">
        <button id="version-v1" class="versions__tab" type="button" role="tab" data-version="v1" aria-selected="true" aria-controls="version-preview">v1</button>
        <button id="version-v1-2" class="versions__tab" type="button" role="tab" data-version="v1.2" aria-selected="false" aria-controls="version-preview" tabindex="-1">v1.2</button>
        <button id="version-v2" class="versions__tab" type="button" role="tab" data-version="v2" aria-selected="false" aria-controls="version-preview" tabindex="-1">v2</button>
        <button id="version-v2-2" class="versions__tab" type="button" role="tab" data-version="v2.2" aria-selected="false" aria-controls="version-preview" tabindex="-1">v2.2</button>
      </div>
      <div class="preview" id="version-preview" role="tabpanel" aria-labelledby="version-v1">
        <div class="preview__controls">
          <div class="preview__profile-settings">
            <div class="preview-setting" role="group" aria-label="Размер карточек">
              <span class="preview-setting__label" aria-hidden="true">Размер карточек</span>
              <div class="preview-setting__options">
                <button class="preview-setting__option" type="button" data-card-size="md" aria-pressed="true">md</button>
                <button class="preview-setting__option" type="button" data-card-size="lg" aria-pressed="false">lg</button>
              </div>
            </div>
            <label class="preview-setting">
              <span class="preview-setting__label">Уровень</span>
              <select class="preview-setting__select" id="loyalty-level">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
              </select>
            </label>
          </div>
          <div class="preview-setting shop-animation" role="group" aria-label="Анимация магазина бонусов">
            <span class="preview-setting__label shop-animation__label" aria-hidden="true">Анимация</span>
            <div class="preview-setting__options shop-animation__options">
              <button class="preview-setting__option" type="button" data-shop-animation="cart" aria-pressed="true">Корзинка</button>
              <button class="preview-setting__option" type="button" data-shop-animation="chips" aria-pressed="false">Фишки</button>
              <button class="preview-setting__option" type="button" data-shop-animation="gifts" aria-pressed="false">Подарки</button>
              <button class="preview-setting__option" type="button" data-shop-animation="chest" aria-pressed="false">Сундук</button>
            </div>
            <p class="shop-animation__sizes" aria-label="Размеры файлов анимаций">
              <span>Корзинка 143,8 КБ</span>
              <span>Фишки 32,3 КБ</span>
              <span>Подарки 57,2 КБ</span>
              <span>Сундук 209,7 КБ</span>
            </p>
          </div>
        </div>
        <div class="preview__frame">
          <iframe class="preview__screen" src="./profile/index.html?rev=carousel-layout" title="Интерактивное превью профиля Olymp"></iframe>
        </div>
        <a class="preview__mobile" href="./profile/index.html?rev=carousel-layout">Mobile demo</a>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="ru" data-theme="blue">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#030534">
    <title>Редизайн ПЛ в Профиле</title>
    <link rel="stylesheet" href="./profile/rt/fonts.css">
    <link rel="stylesheet" href="./profile/rt/base.css">
    <link rel="stylesheet" href="./showcase.css">
    <script src="./showcase.js" defer></script>
  </head>
  <body>
    <main class="showcase">
      <header class="showcase__header">
        <img class="showcase__logo" src="./assets/olymp.svg" alt="Olymp" width="131" height="25">
        <h1>Редизайн ПЛ в Профиле</h1>
      </header>
      <div class="versions" role="tablist" aria-label="Версии шапки">
        <button id="version-v1" class="versions__tab" type="button" role="tab" data-version="v1" aria-selected="true" aria-controls="version-preview">v1</button>
        <button id="version-v1-2" class="versions__tab" type="button" role="tab" data-version="v1.2" aria-selected="false" aria-controls="version-preview" tabindex="-1">v1.2</button>
        <button id="version-v2" class="versions__tab" type="button" role="tab" data-version="v2" aria-selected="false" aria-controls="version-preview" tabindex="-1">v2</button>
        <button id="version-v2-2" class="versions__tab" type="button" role="tab" data-version="v2.2" aria-selected="false" aria-controls="version-preview" tabindex="-1">v2.2</button>
      </div>
      <div class="phone" id="version-preview" role="tabpanel" aria-labelledby="version-v1">
        <div class="phone__body" aria-hidden="true">
          <img src="./assets/device-frame.png" alt="" width="1350" height="2760">
        </div>
        <div class="phone__display">
          <div class="phone__status" aria-hidden="true">
            <span class="phone__time">9:41</span>
            <span class="phone__island"><img src="./assets/device-frame.png" alt=""></span>
            <span class="phone__levels">
              <img src="./assets/status-cellular.svg" alt="">
              <img src="./assets/status-wifi.svg" alt="">
              <img src="./assets/status-battery.svg" alt="">
            </span>
          </div>
          <iframe class="phone__screen" src="./profile/index.html" title="Интерактивное превью профиля Olymp"></iframe>
          <div class="phone__gesture" aria-hidden="true"></div>
        </div>
      </div>
    </main>
  </body>
</html>
